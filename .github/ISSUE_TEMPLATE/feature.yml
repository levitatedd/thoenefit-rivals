name: Feature or chore
description: New functionality, improvement, or maintenance task
labels: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Where this belongs in master backlog #1
      options: [Next, Planned — after prototype, Later]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines "done".
      value: |
        - [ ] 
        - [ ] Docs updated
        - [ ] Tests added / updated
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, risks, privacy considerations
      description: Health-data, privacy, or cost implications; open questions.
